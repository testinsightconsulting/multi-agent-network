[project]
name = "agent-doc-evaluator"
version = "0.1.0"
description = "Rule-based scoring harness for network documentation Q&A agent responses"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.3.1",
]

[project.scripts]
agent-doc-eval = "agent_doc_evaluator.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_doc_evaluator"]

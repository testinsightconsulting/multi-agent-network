device: "Edge-Router-02"
bgp:
  asn: 65002
  router_id: "2.2.2.2"
  neighbors:
    - peer_ip: "192.168.1.1"
      remote_as: 65001
      state: "established"
  routes:
    advertised:
      - "20.0.1.0/24"
      - "20.0.2.0/24"
    received:
      - prefix: "10.0.1.0/24"
        next_hop: "192.168.1.1"
        as_path: "65001"
      - prefix: "10.0.2.0/24"
        next_hop: "192.168.1.1"
        as_path: "65001"

ospf:
  process_id: 1
  router_id: "2.2.2.2"
  areas:
    - area: "0.0.0.0"
      networks:
        - "192.168.1.0/24"
  neighbors:
    - neighbor_id: "1.1.1.1"
      state: "full"
      interface: "ge-0/0/0"

interfaces:
  ge-0/0/0:
    ip: "192.168.1.2"
    mask: "255.255.255.0"
    status: "up"
    protocol: "up"
  ge-0/0/1:
    ip: "172.16.0.1"
    mask: "255.255.255.0"
    status: "up"
    protocol: "up"


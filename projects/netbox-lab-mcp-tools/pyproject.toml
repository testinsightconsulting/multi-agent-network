[project]
name = "netbox-lab-mcp-tools"
version = "0.1.0"
description = "Reference MCP tools for NetBox lab topology and reservation workflows (mock backend)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
]

[project.scripts]
netbox-lab-mcp = "netbox_lab_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netbox_lab_mcp"]

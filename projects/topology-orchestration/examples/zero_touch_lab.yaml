tosca_definitions_version: tosca_simple_yaml_1_0
imports:
  - velocity_types_1_0.yaml
topology_template:
  node_templates:
    topology:
      type: com.spirent.velocity.Topology
      properties:
        name: Zero-Touch Lab (Public Example)
    device_router_a:
      type: com.spirent.velocity.Device
      properties:
        inventory_id: 11111111-1111-4111-8111-111111111101
        inventory_name: Core-Router-A
        property_groups:
          - name: System Identification
            group:
              - name: Make
                value: cisco
              - name: Model
                value: ASR1001-X
              - name: OS Version
                value: IOS-XE 17.09
              - name: ipAddress
                value: 10.0.0.1
              - name: Hostname
                value: core-a.lab.example
          - name: Credentials
            group:
              - name: username
                value: labuser
              - name: password
                value: "***REDACTED***"
    device_router_b:
      type: com.spirent.velocity.Device
      properties:
        inventory_id: 22222222-2222-4222-8222-222222222202
        inventory_name: Edge-Router-B
        property_groups:
          - name: System Identification
            group:
              - name: Make
                value: juniper
              - name: Model
                value: MX204
              - name: OS Version
                value: JunOS 22.4R1
              - name: ipAddress
                value: 10.0.0.2
          - name: Credentials
            group:
              - name: username
                value: labuser
              - name: password
                value: "***REDACTED***"

[project]
name = "topology-orchestration"
version = "0.1.0"
description = "Load Spirent Velocity / TOSCA orchestration topologies into device contexts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.3.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
topology-orchestration = "topology_orchestration.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/topology_orchestration"]
